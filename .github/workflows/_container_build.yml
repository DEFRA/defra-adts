name: ECR container build

on:
  workflow_call:
    inputs:
      service-name:
        description: Name of the service
        required: true
        type: string

      service-directory:
        description: Repository-relative Docker build context
        required: true
        type: string

      dockerfile:
        description: Dockerfile path relative to the repository root
        required: true
        type: string

      ecr-repository:
        description: Name of the ECR repository
        required: true
        type: string

      aws-account-id:
        description: AWS account containing the required role
        required: true
        type: string

      aws-region:
        description: AWS region being used
        required: true
        type: string

      aws-role:
        description: IAM role to assume using GitHub OIDC
        required: true
        type: string

      platforms:
        description: Target container platforms
        required: false
        default: "linux/amd64"
        type: string

      push-main-tag:
        description: Publish a mutable main tag on the default branch
        required: false
        default: true
        type: boolean

    outputs:
      image-uri:
        description: ECR image repository URI
        value: ${{ jobs.container.outputs.image-uri }}

      image-digest:
        description: Digest of the published container image
        value: ${{ jobs.container.outputs.image-digest }}

      image-reference:
        description: Immutable ECR image reference, including digest
        value: ${{ jobs.container.outputs.image-reference }}

  workflow_dispatch:

jobs:
  container:
    name: Containerise ${{ inputs.service-name }}

    runs-on: ubuntu-latest

    timeout-minutes: 30

    permissions:
      contents: read
      id-token: write

    outputs:
      image-uri: ${{ steps.image.outputs.image-uri }}
      image-digest: ${{ steps.build.outputs.digest }}
      image-reference: ${{ steps.result.outputs.image-reference }}

    steps:
      - name: Check out source code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate container build inputs
        shell: bash
        env:
          SERVICE_DIRECTORY: ${{ inputs.service-directory }}
          DOCKERFILE: ${{ inputs.dockerfile }}
        run: |
          set -euo pipefail

          if [[ ! -d "${SERVICE_DIRECTORY}" ]]; then
            echo "::error::Service directory does not exist: ${SERVICE_DIRECTORY}"
            exit 1
          fi

          if [[ ! -f "${DOCKERFILE}" ]]; then
            echo "::error::Dockerfile does not exist: ${DOCKERFILE}"
            exit 1
          fi

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ inputs.aws-account-id }}:role/${{ inputs.aws-role }}
          aws-region: ${{ inputs.aws-region }}
          role-session-name: github-actions-${{ github.run_id }}
          mask-aws-account-id: true

      - name: Sign in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: true

      - name: Set image repository
        id: image
        shell: bash
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: ${{ inputs.ecr-repository }}
        run: |
          set -euo pipefail

          image_uri="${ECR_REGISTRY}/${ECR_REPOSITORY}"

          echo "image-uri=${image_uri}" >> "${GITHUB_OUTPUT}"
          echo "IMAGE_URI=${image_uri}" >> "${GITHUB_ENV}"

      - name: Generate container metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_URI }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=main,enable=${{ inputs.push-main-tag && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
          labels: |
            org.opencontainers.image.title=${{ inputs.service-name }}
            org.opencontainers.image.description=${{ inputs.service-name }} JavaScript service
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate Docker build configuration
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.service-directory }}
          file: ${{ inputs.dockerfile }}
          call: check

#      - name: Build and push container image
#        id: build
#        uses: docker/build-push-action@v7
#        with:
#          context: ${{ inputs.service-directory }}
#          file: ${{ inputs.dockerfile }}
#          platforms: ${{ inputs.platforms }}
#          push: true
#          tags: ${{ steps.metadata.outputs.tags }}
#          labels: ${{ steps.metadata.outputs.labels }}
#          cache-from: type=gha,scope=${{ inputs.service-name }}
#          cache-to: type=gha,mode=max,scope=${{ inputs.service-name }}
#          provenance: mode=max
#          sbom: true
#
#      - name: Set immutable image reference
#        id: result
#        shell: bash
#        env:
#          IMAGE_URI: ${{ steps.image.outputs.image-uri }}
#          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
#        run: |
#          set -euo pipefail
#
#          image_reference="${IMAGE_URI}@${IMAGE_DIGEST}"
#
#          echo "image-reference=${image_reference}" >> "${GITHUB_OUTPUT}"

      - name: Write container build summary
        shell: bash
        env:
          SERVICE_NAME: ${{ inputs.service-name }}
          IMAGE_URI: ${{ steps.image.outputs.image-uri }}
          IMAGE_TAGS: ${{ steps.metadata.outputs.tags }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "## Container image published"
            echo
            echo "| Property | Value |"
            echo "|---|---|"
            echo "| Service | \`${SERVICE_NAME}\` |"
            echo "| Repository | \`${IMAGE_URI}\` |"
            echo "| Digest | \`${IMAGE_DIGEST}\` |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo
            echo "### Published tags"
            echo

            while IFS= read -r tag; do
              if [[ -n "${tag}" ]]; then
                echo "- \`${tag}\`"
              fi
            done <<< "${IMAGE_TAGS}"
          } >> "${GITHUB_STEP_SUMMARY}"