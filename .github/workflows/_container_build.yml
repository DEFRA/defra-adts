name: ECR container build

on:
  workflow_call:
    inputs:
      service-name:
        description: Name of the service
        required: true
        type: string

      service-directory:
        description: Repository-relative Docker build context
        required: true
        type: string

      dockerfile:
        description: Dockerfile path relative to the repository root
        required: true
        type: string

      ecr-repository:
        description: Name of the ECR repository
        required: true
        type: string

      aws-account-id:
        description: AWS account containing the required role
        required: true
        type: string

      aws-region:
        description: AWS region being used
        required: true
        type: string

      aws-role:
        description: IAM role to assume using GitHub OIDC
        required: true
        type: string

      platforms:
        description: Target container platforms
        required: false
        default: "linux/amd64"
        type: string

      is-release:
        description: Set true if the current image built should be a release and labeled as ':latest'
        default: false
        type: boolean

    outputs:
      image-uri:
        description: ECR image repository URI
        value: ${{ jobs.container.outputs.image-uri }}

      image-digest:
        description: Digest of the published container image
        value: ${{ jobs.container.outputs.image-digest }}

      image-reference:
        description: Immutable ECR image reference, including digest
        value: ${{ jobs.container.outputs.image-reference }}

  workflow_dispatch:

jobs:
  container:
    name: Containerise ${{ inputs.service-name }}

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write
      security-events: write

    timeout-minutes: 30

    outputs:
      image-uri: ${{ steps.ecr-login.outputs.registry }}/${{ inputs.ecr-repository }}
      image-digest: ${{ steps.build.outputs.digest }}
      image-reference: ${{ steps.result.outputs.image-reference }}

    steps:
      - name: Check out source code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate container build inputs
        shell: bash
        env:
          SERVICE_DIRECTORY: ${{ inputs.service-directory }}
          DOCKERFILE: ${{ inputs.dockerfile }}
        run: |
          set -euo pipefail

          if [[ ! -d "${SERVICE_DIRECTORY}" ]]; then
            echo "::error::Service directory does not exist: ${SERVICE_DIRECTORY}"
            exit 1
          fi

          if [[ ! -f "${DOCKERFILE}" ]]; then
            echo "::error::Dockerfile does not exist: ${DOCKERFILE}"
            exit 1
          fi

      - name: Fetch service version tags
        run: git fetch --force --tags

      - name: Calculate service version
        id: version
        shell: bash
        env:
          SERVICE: ${{ inputs.service-name }}
          SERVICE_PATH: ${{ inputs.service-directory }}
        run: |
          set -euo pipefail

          TAG_PREFIX="${SERVICE}-v"

          LAST_TAG="$(
            git tag \
              --list "${TAG_PREFIX}[0-9]*.[0-9]*.[0-9]*" \
              --sort=-v:refname |
            head -n 1
          )"

          if [[ -z "${LAST_TAG}" ]]; then
            echo "No previous version tag exists for ${SERVICE}."

            # Check whether the service path exists and contains tracked files.
            if ! git ls-files --error-unmatch "${SERVICE_PATH}" >/dev/null 2>&1 &&
               [[ -z "$(git ls-files "${SERVICE_PATH}")" ]]; then
              echo "No tracked files found under ${SERVICE_PATH}."
              echo "changed=false" >> "${GITHUB_OUTPUT}"
              exit 0
            fi

            VERSION="0.1.0"
            CHANGE_RANGE="HEAD"
            CHANGED="true"
            BUMP_TYPE="initial"
          else
            echo "Last service tag: ${LAST_TAG}"

            CHANGE_RANGE="${LAST_TAG}..HEAD"

            # Determine whether this service has changed since its own
            # most recent successful image build.
            echo "CHANGES: $(git rev-list "${CHANGE_RANGE}" -- "${SERVICE_PATH}")"
            if [[ -z "$(git rev-list "${CHANGE_RANGE}" -- "${SERVICE_PATH}")" ]]; then
              echo "No changes detected for ${SERVICE}."
              echo "changed=false" >> "${GITHUB_OUTPUT}"
              echo "previous_tag=${LAST_TAG}" >> "${GITHUB_OUTPUT}"
              exit 0
            fi

            PREVIOUS_VERSION="${LAST_TAG#${TAG_PREFIX}}"

            if [[ ! "${PREVIOUS_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid previous semantic version: ${PREVIOUS_VERSION}"
              exit 1
            fi

            IFS='.' read -r MAJOR MINOR PATCH <<< "${PREVIOUS_VERSION}"

            COMMIT_MESSAGES="$(
              git log \
                --format='%B%n---END-COMMIT---' \
                "${CHANGE_RANGE}" \
                -- "${SERVICE_PATH}"
            )"

            if grep -Eqi \
              '(^|[[:space:]])BREAKING CHANGE:|^[a-zA-Z]+(\([^)]*\))?!:' \
              <<< "${COMMIT_MESSAGES}"; then
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              BUMP_TYPE="major"

            elif grep -Eqi \
              '^feat(\([^)]*\))?:' \
              <<< "${COMMIT_MESSAGES}"; then
              MINOR=$((MINOR + 1))
              PATCH=0
              BUMP_TYPE="minor"

            else
              PATCH=$((PATCH + 1))
              BUMP_TYPE="patch"
            fi

            VERSION="${MAJOR}.${MINOR}.${PATCH}"
            CHANGED="true"
          fi

          VERSION_TAG="${SERVICE}-v${VERSION}"

          echo "Service: ${SERVICE}"
          echo "Version: ${VERSION}"
          echo "Version tag: ${VERSION_TAG}"
          echo "Bump type: ${BUMP_TYPE}"
          echo "Change range: ${CHANGE_RANGE}"

          {
            echo "changed=${CHANGED}"
            echo "version=${VERSION}"
            echo "version_tag=${VERSION_TAG}"
            echo "bump_type=${BUMP_TYPE}"
            echo "change_range=${CHANGE_RANGE}"
          } >> "${GITHUB_OUTPUT}"

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  #v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ inputs.aws-account-id }}:role/${{ inputs.aws-role }}
          aws-region: ${{ inputs.aws-region }}
          role-session-name: github-actions-${{ github.run_id }}
          mask-aws-account-id: true

      - name: Sign in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd  # v2.1.7
        with:
          mask-password: true

#      - name: Set image repository
#        id: image
#        shell: bash
#        env:
#          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
#          ECR_REPOSITORY: ${{ inputs.ecr-repository }}
#        run: |
#          set -euo pipefail
#
#          image_uri="${ECR_REGISTRY}/${ECR_REPOSITORY}"
#
#          echo "image-uri=${image_uri}" >> "${GITHUB_OUTPUT}"
#          echo "IMAGE_URI=${image_uri}" >> "${GITHUB_ENV}"
#          echo "version-tag=$(cat ${{ inputs.service-directory }}/VERSION_PREFIX).${{ github.run_number }}" >> "${GITHUB_OUTPUT}"

      - name: Generate container metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images:  ${{ steps.ecr-login.outputs.registry }}/${{ inputs.ecr-repository }}
          tags: |
            type=raw,value=v${{ steps.version.outputs.version }}
            type=raw,value=v${{ steps.version.outputs.version }},suffix=-${{ github.sha }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=${{ inputs.service-name }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.description=${{ inputs.service-name }} JavaScript service
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Set up Docker
        uses: docker/setup-docker-action@1a6edb0ba9ac496f6850236981f15d8f9a82254d # v4.0
        with:
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }

      - name: Show metadata tags
        run: |
          echo "Tags are ${{ steps.metadata.outputs.tags }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Build container image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: ${{ inputs.service-directory }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: false
          load: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ inputs.service-name }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service-name }}
          provenance: mode=max
          sbom: true

      - name: Show images
        run: |
          docker images

      # Scan the image before it is pushed
      - name: Scan image with Trivy
        id: trivy-scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ${{ fromJson(steps.metadata.outputs.json).tags[0] }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1

      # Upload SARIF results to GitHub Security
      - name: Generate SARIF report
        if: always()
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ${{ fromJson(steps.metadata.outputs.json).tags[0] }}
          format: sarif
          output: trivy-results.sarif

      - name: Upload SARIF report
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: Fail build if scans failed
        if: ${{ steps.trivy-scan.outcome == 'failure' }}
        run: |
          echo "One or more scans failed. Failing the build."
          exit 1

      # Push image to ECR.
      - name: Push container image
        run: |
          echo "Image destination is ${{ fromJson(steps.metadata.outputs.json).tags[0] }}"
          docker push ${{ fromJson(steps.metadata.outputs.json).tags[0] }}
#          docker tag ${{ fromJson(steps.metadata.outputs.json).tags[0] }} ${{ fromJson(steps.metadata.outputs.json).tags[1] }}
#          docker tag ${{ fromJson(steps.metadata.outputs.json).tags[0] }} ${{ fromJson(steps.metadata.outputs.json).tags[2] }}

      - name: Set immutable image reference
        id: result
        shell: bash
        env:
          IMAGE_URI: ${{ steps.ecr-login.outputs.registry }}/${{ inputs.ecr-repository }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail

          image_reference="${IMAGE_URI}@${IMAGE_DIGEST}"

          echo "image-reference=${image_reference}" >> "${GITHUB_OUTPUT}"

      - name: Create service version tag
        shell: bash
        env:
          SERVICE: ${{ matrix.service }}
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_TAG: ${{ steps.version.outputs.version_tag }}
          BUMP_TYPE: ${{ steps.version.outputs.bump_type }}
        run: |
          set -euo pipefail

          # Ensure another process has not created the same tag.
          git fetch --force --tags

          if git rev-parse "${VERSION_TAG}" >/dev/null 2>&1; then
            echo "Tag ${VERSION_TAG} already exists."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git tag \
            --annotate "${VERSION_TAG}" \
            --message "${SERVICE} ${VERSION} (${BUMP_TYPE} release)"

          git push origin "${VERSION_TAG}"

      - name: Write container build summary
        if: always()
        shell: bash
        env:
          SERVICE_NAME: ${{ inputs.service-name }}
          VERSION: ${{ steps.version.outputs.version }}
          BUMP_TYPE: ${{ steps.version.outputs.bump_type }}
          IMAGE_URI: ${{ steps.ecr-login.outputs.registry }}/${{ inputs.ecr-repository }}
          IMAGE_TAGS: ${{ steps.metadata.outputs.tags }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "## ${SERVICE_NAME} Container image published"
            echo
            echo "| Property | Value |"
            echo "|---|---|"
            echo "| Service | \`${SERVICE_NAME}\` |"
            echo "| Version | \`${VERSION}\` |"
            echo "| Bump Type | \`${BUMP_TYPE}\` |"
            echo "| Repository | \`${IMAGE_URI}\` |"
            echo "| Digest | \`${IMAGE_DIGEST}\` |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo
            echo "### Published tags"
            echo

            while IFS= read -r tag; do
              if [[ -n "${tag}" ]]; then
                echo "- \`${tag}\`"
              fi
            done <<< "${IMAGE_TAGS}"
          } >> "${GITHUB_STEP_SUMMARY}"