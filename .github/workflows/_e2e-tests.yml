name: End to End Testing

on:
  workflow_call:

permissions:
  contents: read

jobs:
  e2e:
    name: Run Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out coordinated commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install root dependencies
        run: npm ci

      - name: Install adts-ui dependencies
        run: npm ci --prefix services/adts-ui

      - name: Install adts-submissions-service dependencies
        run: npm ci --prefix services/adts-submissions-service

      - name: Install adts-backend dependencies
        run: npm ci --prefix services/adts-backend

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Verify Docker engine and Compose
        env:
          TEST_CONTAINER_ENGINE: docker
          DOCKER_CONTEXT: default
          DOCKER_HOST: unix:///var/run/docker.sock
        run: |
          docker info
          docker compose version

      - name: Run Playwright tests (Chromium)
        env:
          TEST_CONTAINER_ENGINE: docker
          DOCKER_CONTEXT: default
          DOCKER_HOST: unix:///var/run/docker.sock
        run: npm run test:e2e:chromium

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload Playwright report on success (last 3 kept)
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-success
          path: playwright-report/
          retention-days: 3