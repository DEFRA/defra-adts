name: Versions

on:
  workflow_call:

jobs:
  versions:
    name: Tag Version Collection

    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:
      - name: Check out source code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Add version collection tag
        id: tag-collection
        shell: bash
        run: |
          set -euo pipefail
            
          # Tag prefixes
          UI_TAG_PREFIX="adts-ui-v"
          BACKEND_TAG_PREFIX="adts-backend-v"
          SUBMISSIONS_TAG_PREFIX="adts-submissions-service-v"
          
          LAST_UI_TAG="$(
            git tag \
              --list "${UI_TAG_PREFIX}[0-9]*.[0-9]*.[0-9]*" \
              --sort=-v:refname |
            head -n 1
          )"
          
          LAST_BACKEND_TAG="$(
            git tag \
              --list "${BACKEND_TAG_PREFIX}[0-9]*.[0-9]*.[0-9]*" \
              --sort=-v:refname |
            head -n 1
          )"
          
          LAST_SUBMISSIONS_TAG="$(
            git tag \
              --list "${SUBMISSIONS_TAG_PREFIX}[0-9]*.[0-9]*.[0-9]*" \
              --sort=-v:refname |
            head -n 1
          )"
          
          ALL_VERSIONS_TAG="${LAST_UI_TAG}/${LAST_BACKEND_TAG}/${LAST_SUBMISSIONS_TAG}"

          git config user.name "${{ github.actor }}"
          git config user.email \
            "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          
          git tag \
            --annotate "${ALL_VERSIONS_TAG}" \
            --message "Service versions in this build: ${ALL_VERSIONS_TAG}"
          git push origin "${ALL_VERSIONS_TAG}"
          
          echo "all_versions=${ALL_VERSIONS_TAG}" >> ${GITHUB_OUTPUT}

      - name: Version summary
        if: always()
        shell: bash
        env: 
          ALL_VERSIONS: ${{ steps.tag-collection.outputs.all_versions }}
        run: |
          {
            echo "## Service versions"
            echo
            echo '```text'
            echo "Version collection: ${All_VERSIONS}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"