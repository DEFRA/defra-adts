name: Versions

on:
  workflow_call:

jobs:
  versions:
    name: Tag Version Collection

    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:
      - name: Check out source code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Add version collection tag
        id: tag-collection
        shell: bash
        run: |
          set -euox pipefail
          
          get_latest_tag() {
            prefix=""
            arg1=$1
            if [ ! -z $1 ]; then
              prefix="$(
                git tag \
                  --list "${arg1}[0-9]*.[0-9]*.[0-9]*" \
                  --sort=-v:refname \
                | grep -v '_' \
                | sed -E 's/^(${arg1}[0-9]+\.[0-9]+\.[0-9]+).*/\1 &/' \
                | head -n 1 \
                | cut -d' ' -f2-
              )"
            fi
            echo $prefix
          }

          LAST_UI_TAG="$( get_latest_tag adts-ui-v )"
          
          LAST_BACKEND_TAG="$( get_latest_tag adts-backend-v )"
          
          LAST_SUBMISSIONS_TAG="$( get_latest_tag adts-submissions-service-v )"
          
          ALL_VERSIONS_TAG="${LAST_UI_TAG}_${LAST_BACKEND_TAG}_${LAST_SUBMISSIONS_TAG}"

          git config user.name "${{ github.actor }}"
          git config user.email \
            "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          
          #git tag \
          #  --annotate "${ALL_VERSIONS_TAG}" \
          #  --message "Service versions in this build: ${ALL_VERSIONS_TAG}"
          #git push origin "${ALL_VERSIONS_TAG}"
          
          echo "all_versions=${ALL_VERSIONS_TAG}" >> ${GITHUB_OUTPUT}

      - name: Version summary
        if: always()
        shell: bash
        env: 
          ALL_VERSIONS: ${{ steps.tag-collection.outputs.all_versions }}
        run: |
          {
            echo "## Service versions"
            echo
            echo '```text'
            echo "Version collection: ${All_VERSIONS}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"