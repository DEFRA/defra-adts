name: Workflow

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: adts-services-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect_changes:
    name: Detect service changes
    runs-on: ubuntu-latest

    outputs:
      ui_service: ${{ steps.filter.outputs.ui_service }}
      backend_service: ${{ steps.filter.outputs.backend_service }}
      submissions_service: ${{ steps.filter.outputs.submissions_service }}
      any_service: ${{ steps.filter.outputs.any_service }}
      e2e_tests: ${{ steps.filter.outputs.e2e_tests }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Detect changed services
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  #v4.0.3
        with:
          filters: |
            ui_service:
              - 'services/adts-ui/**'
              - ".github/workflows/adts-services_build.yml"
              - ".github/workflows/_validation.yml"
              - ".github/workflows/_container_build.yml"

            backend_service:
              - 'services/adts-backend/**'
              - 'tests/api/**'
              - 'local/dynamodb/**'
              - ".github/workflows/adts-services_build.yml"
              - ".github/workflows/_validation.yml"
              - ".github/workflows/_container_build.yml"

            submissions_service:
              - 'services/adts-submissions-service/**'
              - ".github/workflows/adts-services_build.yml"
              - ".github/workflows/_validation.yml"
              - ".github/workflows/_container_build.yml"

            any_service:
              - 'services/adts-ui/**'
              - 'services/adts-backend/**'
              - 'services/adts-submissions-service/**'
              - ".github/workflows/adts-services_build.yml"
              - ".github/workflows/_validation.yml"
              - ".github/workflows/_container_build.yml"
            
            e2e_tests:
              - 'tests/api/**'
              - 'tests/e2e/**'
              - 'local/dynamodb/**'
              - 'playwright.config.js'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/_e2e-tests.yml'

      - name: Display change detection results
        shell: bash
        env:
          UI_CHANGED: ${{ steps.filter.outputs.ui_service }}
          BACKEND_CHANGED: ${{ steps.filter.outputs.backend_service }}
          SUBMISSIONS_CHANGED: ${{ steps.filter.outputs.submissions_service }}
          ANY_CHANGED: ${{ steps.filter.outputs.any_service }}
          E2E_CHANGED: ${{ steps.filter.outputs.e2e_tests }}
        run: |
          set -euo pipefail

          echo "ADTS UI changed: ${UI_CHANGED}"
          echo "ADTS Backend changed: ${BACKEND_CHANGED}"
          echo "ADTS Submissions service changed: ${SUBMISSIONS_CHANGED}"
          echo "ADTS Any service changed: ${ANY_CHANGED}"
          echo "ADTS e2e service changes: ${E2E_CHANGED}"

  set_service_matrix:
    runs-on: ubuntu-latest
    needs:
      - detect_changes
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Set Service Matrix
        id: set-matrix
        run: |
          MATRIX="matrix={\"include\":["
          if [[ "${{ needs.detect_changes.outputs.ui_service }}" == 'true' || "${{ needs.detect_changes.outputs.e2e_tests }}" == 'true' ]]; then
            MATRIX=$MATRIX"{\"service-name\": \"adts-ui\","
            MATRIX=$MATRIX"\"service-directory\": \"services/adts-ui\","
            MATRIX=$MATRIX"\"node-version\": \"24\","
            MATRIX=$MATRIX"\"run-audit\": false,"
            MATRIX=$MATRIX"\"run-lint\": true,"
            MATRIX=$MATRIX"\"run-format-check\": false,"
            MATRIX=$MATRIX"\"run-tests\": true,"
            MATRIX=$MATRIX"\"run-sonarqube-scan\": true,"
            MATRIX=$MATRIX"\"test-command\": \"npm run test:coverage && npm run test:integration\","
            MATRIX=$MATRIX"\"build-command\": \"npm run build\","
            MATRIX=$MATRIX"\"sonar-token\": \"SONAR_TOKEN\","
            MATRIX=$MATRIX"\"sonarqube-scan-directory\": \".\","
            MATRIX=$MATRIX"\"dockerfile\": \"services/adts-ui/Dockerfile\","
            MATRIX=$MATRIX"\"aws-region\": \"AWS_REGION\","
            MATRIX=$MATRIX"\"ecr-repository\": \"ADTS_UI_ECR\","
            MATRIX=$MATRIX"\"aws-account-id\": \"AWS_ECR_ROLE_ACCOUNT_ID\","
            MATRIX=$MATRIX"\"aws-role\": \"AWS_ECR_ROLE_NAME\","
            MATRIX=$MATRIX"\"platforms\": \"linux\""
            MATRIX=$MATRIX"},"
          fi
          if [[ "${{ needs.detect_changes.outputs.backend_service }}" == 'true' || "${{ needs.detect_changes.outputs.e2e_tests }}" == 'true' ]]; then
            MATRIX=$MATRIX"{\"service-name\": \"adts-backend\","
            MATRIX=$MATRIX"\"service-directory\": \"services/adts-backend\","
            MATRIX=$MATRIX"\"node-version\": \"24\","
            MATRIX=$MATRIX"\"run-audit\": false,"
            MATRIX=$MATRIX"\"run-lint\": true,"
            MATRIX=$MATRIX"\"run-format-check\": false,"
            MATRIX=$MATRIX"\"run-tests\": true,"
            MATRIX=$MATRIX"\"run-sonarqube-scan\": true,"
            MATRIX=$MATRIX"\"test-command\": \"npm run test:coverage && npm run test:integration && npm run test:contract && npm run test:api\","
            MATRIX=$MATRIX"\"build-command\": \"npm run build\","
            MATRIX=$MATRIX"\"sonar-token\": \"BACKEND_SONAR_TOKEN\","
            MATRIX=$MATRIX"\"dockerfile\": \"services/adts-backend/Dockerfile\","
            MATRIX=$MATRIX"\"aws-region\": \"AWS_REGION\","
            MATRIX=$MATRIX"\"ecr-repository\": \"ADTS_BACKEND_ECR\","
            MATRIX=$MATRIX"\"aws-account-id\": \"AWS_ECR_ROLE_ACCOUNT_ID\","
            MATRIX=$MATRIX"\"aws-role\": \"AWS_ECR_ROLE_NAME\","
            MATRIX=$MATRIX"\"platforms\": \"linux\""
            MATRIX=$MATRIX"},"
          fi
          if [[ "${{ needs.detect_changes.outputs.submissions_service }}" == 'true' || "${{ needs.detect_changes.outputs.e2e_tests }}" == 'true' ]]; then
            MATRIX=$MATRIX"{\"service-name\": \"adts-submissions-service\","
            MATRIX=$MATRIX"\"service-directory\": \"services/adts-submissions-service\","
            MATRIX=$MATRIX"\"node-version\": \"24\","
            MATRIX=$MATRIX"\"run-audit\": false,"
            MATRIX=$MATRIX"\"run-lint\": true,"
            MATRIX=$MATRIX"\"run-format-check\": false,"
            MATRIX=$MATRIX"\"run-tests\": true,"
            MATRIX=$MATRIX"\"run-sonarqube-scan\": true,"
            MATRIX=$MATRIX"\"test-command\": \"npm run test:coverage\","
            MATRIX=$MATRIX"\"build-command\": \"npm run build\","
            MATRIX=$MATRIX"\"sonar-token\": \"SUBMISSIONS_SONAR_TOKEN\","
            MATRIX=$MATRIX"\"dockerfile\": \"services/adts-submissions-service/Dockerfile\","
            MATRIX=$MATRIX"\"aws-region\": \"AWS_REGION\","
            MATRIX=$MATRIX"\"ecr-repository\": \"ADTS_SUBMISSIONS_ECR\","
            MATRIX=$MATRIX"\"aws-account-id\": \"AWS_ECR_ROLE_ACCOUNT_ID\","
            MATRIX=$MATRIX"\"aws-role\": \"AWS_ECR_ROLE_NAME\","
            MATRIX=$MATRIX"\"platforms\": \"linux\""
            MATRIX=$MATRIX"}"
          fi
          MATRIX=$MATRIX"]}"
          echo $MATRIX
          echo $MATRIX >> $GITHUB_OUTPUT

  # Run validation for all services in the matrix
  validate_services:
    name: Validate
    needs:
      - detect_changes
      - set_service_matrix

    if: ${{ needs.set_service_matrix.outputs.matrix != '{"include":[]}' }}
    strategy:
      matrix: ${{ fromJson(needs.set_service_matrix.outputs.matrix) }}

    permissions:
      contents: read

    uses: ./.github/workflows/_validation.yml
    with:
      service-name: ${{ matrix.service-name }}
      service-directory: ${{ matrix.service-directory }}
      node-version: ${{ matrix.node-version }}
      run-audit: ${{ matrix.run-audit }}
      run-lint: ${{ matrix.run-lint }}
      run-format-check: ${{ matrix.run-format-check }}
      run-tests: ${{ matrix.run-tests }}
      run-sonarqube-scan: ${{ matrix.run-sonarqube-scan }}
      test-command: ${{ matrix.test-command }}
      build-command: ${{ matrix.build-command }}
      sonarqube-scan-directory: >-
        ${{
          matrix.sonarqube-scan-directory != ''
          && matrix.sonarqube-scan-directory
          || matrix.service-directory
        }}
    secrets:
      SQ_ACCESS_TOKEN: >-
        ${{ 
          matrix.sonar-token == 'SONAR_TOKEN'
          && secrets.SONAR_TOKEN
          || matrix.sonar-token == 'BACKEND_SONAR_TOKEN'
          && secrets.BACKEND_SONAR_TOKEN
          || matrix.sonar-token == 'SUBMISSIONS_SONAR_TOKEN'
          && secrets.SUBMISSIONS_SONAR_TOKEN
        }}

  e2e_testing:
    name: End to End Tests
    needs:
      - detect_changes
      - validate_services

    # Run e2e testing if any service or the e2e test assets have been changed
    if: |
      ${{
        always() &&
        needs.validate_services.result == 'success' &&
        (
          needs.detect_changes.outputs.any_service == 'true' ||
          needs.detect_changes.outputs.e2e_tests == 'true'
        )
       }}

    uses: ./.github/workflows/_e2e-tests.yml

  # Run container build for all services in the matrix
  build_containers:
    name: Publish UI container image
    needs:
      - detect_changes
      - set_service_matrix
      - validate_services
      - e2e_testing

    if: ${{ github.event_name != 'pull_request' }}
    strategy:
      matrix: ${{ fromJson(needs.set_service_matrix.outputs.matrix) }}

    permissions:
      contents: write
      id-token: write
      security-events: write

    uses: ./.github/workflows/_container_build.yml
    with:
      service-name: ${{ matrix.service-name }}
      service-directory: ${{ matrix.service-directory }}
      dockerfile: ${{ matrix.dockerfile }}
      aws-region: ${{ vars[matrix.aws-region] }}
      ecr-repository: ${{ vars[matrix.ecr-repository] }}
      aws-account-id: ${{ vars[matrix.aws-account-id] }}
      aws-role: ${{ vars[matrix.aws-role] }}
      platforms: ${{ matrix.platforms }}

  update_versions:
    name: Versions
    needs:
      - detect_changes
      - e2e_testing
      - build_containers

    permissions:
      contents: write

    if: |
      ${{
        always() &&
        github.event_name != 'pull_request' &&
        needs.e2e_testing.result == 'success' &&
        (
          needs.build_containers.result == 'success' ||
          (
            needs.build_containers.result == 'skipped' &&
            needs.detect_changes.outputs.e2e_tests == 'true'
          )
        )
      }}

    uses: ./.github/workflows/_update_versions.yml