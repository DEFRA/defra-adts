name: Validate and build services

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: adts-services-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect_changes:
    name: Detect application changes
    runs-on: ubuntu-latest

    outputs:
      ui_service: ${{ steps.filter.outputs.ui_service }}
      backend_service: ${{ steps.filter.outputs.backend_service }}
      submissions_service: ${{ steps.filter.outputs.submissions_service }}
      any_service: ${{ steps.filter.outputs.any_service }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Detect changed applications
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  #v4.0.3
        with:
          filters: |
            ui_service:
              - 'services/adts-ui/**'
              - ".github/workflows/adts-services_build.yml"
              - ".github/workflows/_validation.yml"
              - ".github/workflows/_container_build.yml"

            backend_service:
              - 'services/adts-backend/**'
              - ".github/workflows/adts-services_build.yml"
              - ".github/workflows/_validation.yml"
              - ".github/workflows/_container_build.yml"

            submissions_service:
              - 'services/adts-submissions-service/**'
              - ".github/workflows/adts-services_build.yml"
              - ".github/workflows/_validation.yml"
              - ".github/workflows/_container_build.yml"

            any_service:
              - 'services/adts-ui/**'
              - 'services/adts-backend/**'
              - ".github/workflows/adts-services_build.yml"
              - ".github/workflows/_validation.yml"
              - ".github/workflows/_container_build.yml"
              - '.github/workflows/_e2e-tests.yml'

      - name: Display change detection results
        shell: bash
        env:
          UI_CHANGED: ${{ steps.filter.outputs.ui_service }}
          BACKEND_CHANGED: ${{ steps.filter.outputs.backend_service }}
          SUBMISSIONS_CHANGED: ${{ steps.filter.outputs.submissions_service }}
        run: |
          set -euo pipefail

          echo "ADTS UI changed: ${UI_CHANGED}"
          echo "ADTS Backend changed: ${BACKEND_CHANGED}"
          echo "ADTS Submissions service changed: ${SUBMISSIONS_CHANGED}"

  validate_ui_service:
    name: Validate ADTS UI
    needs:
      - detect_changes

    if: ${{ needs.detect_changes.outputs.ui_service == 'true' }}

    permissions:
      contents: read

    uses: ./.github/workflows/_validation.yml

    with:
      service-name: adts-ui
      service-directory: services/adts-ui
      node-version: "24"
      run-audit: false
      run-lint: true
      run-format-check: false
      run-tests: true
      run-sonarqube-scan: true
      test-command: npm run test:coverage
      build-command: npm run build
    secrets:
      SQ_ACCESS_TOKEN: ${{ secrets.SONAR_TOKEN }}

  validate_backend_service:
    name: Validate ADTS Backend
    needs:
      - detect_changes

    if: ${{ needs.detect_changes.outputs.backend_service == 'true' }}

    permissions:
      contents: read

    uses: ./.github/workflows/_validation.yml

    with:
      service-name: adts-backend
      service-directory: services/adts-backend
      node-version: "24"
      run-audit: false
      run-lint: true
      run-format-check: false
      run-tests: true
      run-sonarqube-scan: true
      test-command: npm run test:coverage
      build-command: npm run build
    secrets:
      SQ_ACCESS_TOKEN: ${{ secrets.BACKEND_SONAR_TOKEN }}

  validate_submissions_service:
    name: Validate ADTS Submissions
    needs:
      - detect_changes

    if: ${{ needs.detect_changes.outputs.submissions_service == 'true' }}

    permissions:
      contents: read

    uses: ./.github/workflows/_validation.yml

    with:
      service-name: adts-submissions-service
      service-directory: services/adts-submissions-service
      node-version: "24"
      run-audit: false
      run-lint: true
      run-format-check: false
      run-tests: true
      run-sonarqube-scan: true
      test-command: npm run test:coverage
      build-command: npm run build
    secrets:
      SQ_ACCESS_TOKEN: ${{ secrets.SUBMISSIONS_SONAR_TOKEN }}

  e2e_testing:
    name: Run End to End Tests

    needs:
      - detect_changes
      - validate_ui_service
      - validate_backend_service
      - validate_submissions_service

    # An explicit condition is required because one of the validation jobs
    # may legitimately have been skipped.
    if: |
      ${{
        !cancelled() &&
        needs.detect_changes.outputs.any_service == 'true' &&
        (
          needs.detect_changes.outputs.ui_service != 'true' ||
          needs.validate_ui_service.result == 'success'
        ) &&
        (
          needs.detect_changes.outputs.backend_service != 'true' ||
          needs.validate_backend_service.result == 'success'
        ) &&
        (
          needs.detect_changes.outputs.submissions_service != 'true' ||
          needs.validate_submissions_service.result == 'success'
        )
      }}

    uses: ./.github/workflows/_e2e-tests.yml

  build_ui_container:
    name: Build and publish UI container image

    needs:
      - detect_changes
      - validate_ui_service
      - e2e_testing

    if: |
      ${{
        !cancelled() &&
        needs.detect_changes.outputs.ui_service == 'true' &&
        needs.validate_ui_service.result == 'success' &&
        needs.e2e_testing.result == 'success'
      }}
#        github.event_name != 'pull_request'

    permissions:
      contents: read
      id-token: write
      security-events: write

    uses: ./.github/workflows/_container_build.yml

    with:
      service-name: adts-ui
      service-directory: services/adts-ui
      dockerfile: services/adts-ui/Dockerfile
      aws-region: ${{ vars.AWS_REGION }}
      ecr-repository: ${{ vars.ADTS_UI_ECR }}
      aws-account-id: ${{ vars.AWS_ECR_ROLE_ACCOUNT_ID }}
      aws-role: ${{ vars.AWS_ECR_ROLE_NAME }}
      platforms: linux
      is-release: true

  build_backend_container:
    name: Build and publish Backend container image

    needs:
      - detect_changes
      - validate_backend_service
      - e2e_testing

    if: |
      ${{
        !cancelled() &&
        needs.detect_changes.outputs.backend_service == 'true' &&
        needs.validate_backend_service.result == 'success' &&
        needs.e2e_testing.result == 'success'
      }}
#        github.event_name != 'pull_request'

    permissions:
      contents: read
      id-token: write
      security-events: write

    uses: ./.github/workflows/_container_build.yml

    with:
      service-name: adts-backend
      service-directory: services/adts-backend
      dockerfile: services/adts-backend/Dockerfile
      aws-region: ${{ vars.AWS_REGION }}
      ecr-repository: ${{ vars.ADTS_BACKEND_ECR }}
      aws-account-id: ${{ vars.AWS_ECR_ROLE_ACCOUNT_ID }}
      aws-role: ${{ vars.AWS_ECR_ROLE_NAME }}
      platforms: linux
      is-release: true

  build_submissions_container:
    name: Build and publish Submissions container image

    needs:
      - detect_changes
      - validate_submissions_service
      - e2e_testing

    if: |
      ${{
        !cancelled() &&
        needs.detect_changes.outputs.submissions_service == 'true' &&
        needs.validate_submissions_service.result == 'success' &&
        needs.e2e_testing.result == 'success'
      }}
#        github.event_name != 'pull_request'

    permissions:
      contents: read
      id-token: write
      security-events: write

    uses: ./.github/workflows/_container_build.yml

    with:
      service-name: adts-submissions-service
      service-directory: services/adts-submissions-service
      dockerfile: services/adts-submissions-service/Dockerfile
      aws-region: ${{ vars.AWS_REGION }}
      ecr-repository: ${{ vars.ADTS_SUBMISSIONS_ECR }}
      aws-account-id: ${{ vars.AWS_ECR_ROLE_ACCOUNT_ID }}
      aws-role: ${{ vars.AWS_ECR_ROLE_NAME }}
      platforms: linux
      is-release: true