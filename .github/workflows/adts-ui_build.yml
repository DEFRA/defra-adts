name: ADTS UI CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "services/adts-ui/**"
      - "shared/**"
      - ".github/workflows/adts-ui_build.yml"
      - ".github/workflows/_validation.yml"
      - ".github/workflows/_container_build.yml"

  push:
    branches:
      - main
    paths:
      - "services/adts-ui/**"
      - "shared/**"
      - ".github/workflows/adts-ui_build.yml"
      - ".github/workflows/_validation.yml"
      - ".github/workflows/_container_build.yml"

  workflow_dispatch:

concurrency:
  group: adts-ui-ci-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  validate:
    name: Validate service

    uses: ./.github/workflows/_validation.yml

    permissions:
      contents: read

    with:
      service-name: adts-ui
      service-directory: services/adts-ui
      node-version: "24"
      run-audit: false
      run-lint: false
      run-format-check: false
      run-tests: false
      test-command: npm test -- --ci --coverage
#      build-command: npm run build
