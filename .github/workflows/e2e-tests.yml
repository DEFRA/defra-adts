name:  E2E tests (Playwright)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Run Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            services/adts-ui/package-lock.json
            services/adts-lims-adapter/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install adts-ui dependencies
        run: npm ci --prefix services/adts-ui

      - name: Install adts-lims-adapter dependencies
        run: npm ci --prefix services/adts-lims-adapter

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests (Chromium)
        run: npm run test:e2e:chromium

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload Playwright report on success (last 3 kept)
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-success
          path: playwright-report/
          retention-days: 3