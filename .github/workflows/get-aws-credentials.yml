name: Get AWS Credentials

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  container:
    name: Test getting credentials for AWS

    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::783559591987:role/github_actions_pipeline_ecr_role
          aws-region: eu-west-2
