name: Build and publish service images

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

# Prevent two main-branch runs from calculating the same next version.
concurrency:
  group: service-versioning-main
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

env:
  AWS_REGION: eu-west-2

jobs:
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: adts-ui
            service-path: services/adts-ui
            ecr-repository: ${{ vars.ADTS_UI_ECR }}

          - service: adts-backend
            service-path: services/adts-backend
            ecr-repository: ${{ vars.ADTS_BACKEND_ECR }}

          - service: adts-submissions-service
            service-path: services/adts-submissions-service
            ecr-repository: ${{ vars.ADTS_SUBMISSIONS_ECR }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch service version tags
        run: git fetch --force --tags

      - name: Calculate service version
        id: version
        shell: bash
        env:
          APPLICATION: ${{ matrix.service }}
          APPLICATION_PATH: ${{ matrix.service-path }}
        run: |
          set -euo pipefail

          TAG_PREFIX="${APPLICATION}-v"

          LAST_TAG="$(
            git tag \
              --list "${TAG_PREFIX}[0-9]*.[0-9]*.[0-9]*" \
              --sort=-v:refname |
            head -n 1
          )"

          if [[ -z "${LAST_TAG}" ]]; then
            echo "No previous version tag exists for ${APPLICATION}."

            # Check whether the service path exists and contains tracked files.
            if ! git ls-files --error-unmatch "${APPLICATION_PATH}" >/dev/null 2>&1 &&
               [[ -z "$(git ls-files "${APPLICATION_PATH}")" ]]; then
              echo "No tracked files found under ${APPLICATION_PATH}."
              echo "changed=false" >> "${GITHUB_OUTPUT}"
              exit 0
            fi

            VERSION="0.1.0"
            CHANGE_RANGE="HEAD"
            CHANGED="true"
            BUMP_TYPE="initial"
          else
            echo "Last service tag: ${LAST_TAG}"

            CHANGE_RANGE="${LAST_TAG}..HEAD"

            # Determine whether this service has changed since its own
            # most recent successful image build.
            if [[ -z "$(git rev-list "${CHANGE_RANGE}" -- "${APPLICATION_PATH}")" ]]; then
              echo "No changes detected for ${APPLICATION}."
              echo "changed=false" >> "${GITHUB_OUTPUT}"
              echo "previous_tag=${LAST_TAG}" >> "${GITHUB_OUTPUT}"
              exit 0
            fi

            PREVIOUS_VERSION="${LAST_TAG#${TAG_PREFIX}}"

            if [[ ! "${PREVIOUS_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid previous semantic version: ${PREVIOUS_VERSION}"
              exit 1
            fi

            IFS='.' read -r MAJOR MINOR PATCH <<< "${PREVIOUS_VERSION}"

            COMMIT_MESSAGES="$(
              git log \
                --format='%B%n---END-COMMIT---' \
                "${CHANGE_RANGE}" \
                -- "${APPLICATION_PATH}"
            )"

            if grep -Eqi \
              '(^|[[:space:]])BREAKING CHANGE:|^[a-zA-Z]+(\([^)]*\))?!:' \
              <<< "${COMMIT_MESSAGES}"; then
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              BUMP_TYPE="major"

            elif grep -Eqi \
              '^feat(\([^)]*\))?:' \
              <<< "${COMMIT_MESSAGES}"; then
              MINOR=$((MINOR + 1))
              PATCH=0
              BUMP_TYPE="minor"

            else
              PATCH=$((PATCH + 1))
              BUMP_TYPE="patch"
            fi

            VERSION="${MAJOR}.${MINOR}.${PATCH}"
            CHANGED="true"
          fi

          VERSION_TAG="${APPLICATION}-v${VERSION}"

          echo "Application: ${APPLICATION}"
          echo "Version: ${VERSION}"
          echo "Version tag: ${VERSION_TAG}"
          echo "Bump type: ${BUMP_TYPE}"
          echo "Change range: ${CHANGE_RANGE}"

          {
            echo "changed=${CHANGED}"
            echo "version=${VERSION}"
            echo "version_tag=${VERSION_TAG}"
            echo "bump_type=${BUMP_TYPE}"
            echo "change_range=${CHANGE_RANGE}"
          } >> "${GITHUB_OUTPUT}"

      - name: Configure AWS credentials
        if: steps.version.outputs.changed == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  #v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ECR_ROLE_ACCOUNT_ID }}:role/${{ vars.AWS_ECR_ROLE_NAME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        if: steps.version.outputs.changed == 'true'
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd  # v2.1.7
        with:
          mask-password: true

