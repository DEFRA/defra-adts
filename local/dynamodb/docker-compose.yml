name: adts-dynamodb-local

services:
  dynamodb:
    image: amazon/dynamodb-local:3.3.2
    container_name: adts-dynamodb-local
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/data"]
    user: root
    ports:
      - "8000:8000"
    volumes:
      - dynamodb-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:8000 || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20

  # One-shot job: creates the ADTS tables (if missing) and loads sample data.
  init:
    image: amazon/aws-cli:2.38.5
    container_name: adts-dynamodb-init
    depends_on:
      dynamodb:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_REGION: eu-west-2
      DYNAMODB_ENDPOINT: http://dynamodb:8000
      SEED_DATA: ${SEED_DATA:-true}
    volumes:
      - ./tables:/tables:ro
      - ./seed:/seed:ro
      - ./init.sh:/init.sh:ro
    entrypoint: ["/bin/sh", "/init.sh"]

  # Optional web UI for browsing data: docker compose --profile ui up -d
  admin:
    image: aaronshaf/dynamodb-admin:latest
    container_name: adts-dynamodb-admin
    profiles: ["ui"]
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      DYNAMO_ENDPOINT: http://dynamodb:8000
      AWS_REGION: eu-west-2
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    ports:
      - "8001:8001"

volumes:
  dynamodb-data:
