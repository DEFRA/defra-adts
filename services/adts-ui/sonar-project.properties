sonar.projectKey=DEFRA_defra-adts
sonar.organization=defra

# Name and version displayed in the SonarCloud UI
sonar.projectName=defra-adts
sonar.projectVersion=1.0

# Source and test folders (per-service)
sonar.sources=src
sonar.tests=tests

# Coverage reports (Jest LCOV output per service)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Exclude generated / third-party / test artefacts
sonar.exclusions=**/node_modules/**,**/coverage/**,**/dist/**
# ,**/test-results/**,**/*.min.js,**/public/js/**,**/public/css/**

# Encoding
sonar.sourceEncoding=UTF-8