sonar.projectKey=DEFRA_defra-adts
sonar.organization=defra

# Name and version displayed in the SonarCloud UI
sonar.projectName=defra-adts
sonar.projectVersion=1.0

# Source and test folders (per-service)
sonar.sources=services/adts-ui/src
sonar.tests=services/adts-ui/tests,tests

# Coverage reports (Jest LCOV output per service)
sonar.javascript.lcov.reportPaths=services/adts-ui/coverage/lcov.info

# Exclude generated / third-party / test artefacts / Backend and Submissions services
sonar.exclusions=**/node_modules/**,**/coverage/**,**/dist/**,**/playwright-report/**,**/test-results/**,**/*.min.js,**/public/js/**,**/public/css/**,services/adts-backend,services/adts-submissions-service

# Encoding
sonar.sourceEncoding=UTF-8