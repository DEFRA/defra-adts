sonar.projectKey=DEFRA_defra-adts
sonar.organization=defra

# Name and version displayed in the SonarCloud UI
sonar.projectName=defra-adts
sonar.projectVersion=1.0

# Source and test folders (per-service)
sonar.sources=services/adts-ui/src,services/adts-backend/src,services/adts-submissions-service/src
sonar.tests=services/adts-ui/tests,services/adts-backend/tests,services/adts-submissions-service/tests,tests/e2e,tests/api

# Coverage reports (Jest LCOV output per service)
sonar.javascript.lcov.reportPaths=services/adts-ui/coverage/lcov.info,services/adts-backend/coverage/lcov.info,services/adts-submissions-service/coverage/lcov.info

# Exclude generated / third-party / test artefacts
sonar.exclusions=**/node_modules/**,**/coverage/**,**/dist/**,**/playwright-report/**,**/test-results/**,**/*.min.js,**/public/js/**,**/public/css/**,services/**/src/index.js

# Encoding
sonar.sourceEncoding=UTF-8