openapi: 3.0.3
info:
  title: ADTS LIMS Submission Contract
  version: 1.0.0
  description: >
    Planned submission-service boundary for posting a completed report and
    selected tests to LIMS. Confirm exact LIMS fields and idempotency semantics
    with the LIMS integration before implementation.
servers:
  - url: /
paths:
  /submissions:
    post:
      summary: Create or return a completed submission
      description: >
        The backend draft ID is used as the idempotency key across retries.
        LIMS creates a submissionId when it accepts the report and returns it
        in the successful response. The operation must be idempotent so an
        uncertain response cannot create duplicate reports.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
          description: Stable backend-generated draft ID, used to make retries idempotent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [formData]
              properties:
                formData:
                  type: object
                  additionalProperties: true
                  description: >
                    Completed ADTS/APHA report, one species, one or more
                    animals, one or more selected tests, and delivery address.
                    Exact field schema is pending task refinement.
      responses:
        '200':
          description: Previously accepted submission returned for an idempotent retry, including its LIMS-generated submission ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionResult'
        '201':
          description: Submission created in LIMS with its LIMS-generated submission ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionResult'
        '400':
          description: Invalid report or order payload
        '409':
          description: Idempotency key conflicts with a different submission payload
        '422':
          description: Required report, kit, or delivery data is invalid
        '5XX':
          description: LIMS unavailable or submission outcome is uncertain; retry with the same key
components:
  schemas:
    SubmissionResult:
      type: object
      required: [submissionId, status, documents]
      properties:
        submissionId:
          type: string
        status:
          type: string
          enum: [submitted]
        documents:
          type: array
          items:
            type: object
            required: [documentId, label]
            properties:
              documentId:
                type: string
              label:
                type: string
              url:
                type: string
                format: uri
